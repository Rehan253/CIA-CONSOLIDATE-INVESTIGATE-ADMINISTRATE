services:
  db:
    image: mysql:5.7
    container_name: dev_db
    volumes:
      - db_data:/var/lib/mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: dev_db
    networks:
      - backend

  api:
    container_name: dev_api
    image: cia-backend
    build: .
    restart: always
    environment:
      DB_HOST: db
      DB_USER: ${DB_USER}
      DB_PASS: ${DB_PASS}
      JWT_SECRET: ${JWT_SECRET}
      CORS_ORIGIN: ${CORS_ORIGIN}
    ports:
      - "3001:3001"
    networks:
      - backend
    depends_on:
      - db

networks:
  backend:
    driver: bridge
volumes:
  db_data:
