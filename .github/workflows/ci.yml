name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  # Stage 1 - run all checks and tests first (parallel)
  # Cheap checks fail fast before we spend time on Docker builds

  typecheck-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "18"
      - name: Install dependencies
        working-directory: back_student/back_student/back_student
        run: yarn install --ignore-scripts
      - name: TypeScript type check
        working-directory: back_student/back_student/back_student
        run: yarn tsc --noEmit

  test-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "18"
      - name: Install dependencies
        working-directory: back_student/back_student/back_student
        run: yarn install --ignore-scripts
      - name: Run tests
        working-directory: back_student/back_student/back_student
        run: yarn test --passWithNoTests

  build-check-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "18"
      - name: Install dependencies
        working-directory: front_student/front_student
        run: yarn install
      - name: Build frontend
        working-directory: front_student/front_student
        run: yarn build
        env:
          NODE_OPTIONS: --openssl-legacy-provider

  # Stage 2 - build Docker images only after all tests pass

  build-backend:
    runs-on: ubuntu-latest
    needs: [typecheck-backend, test-backend]
    steps:
      - uses: actions/checkout@v4
      - name: Build backend Docker image
        run: docker build -t cia-backend ./back_student/back_student/back_student

  build-frontend:
    runs-on: ubuntu-latest
    needs: [build-check-frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build frontend Docker image
        run: docker build -t cia-frontend ./front_student/front_student
